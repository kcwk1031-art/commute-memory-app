<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>通勤測試行程報表</title>
  <style>
    :root { --bg:#f3f5f1; --surface:#fff; --ink:#12231f; --muted:#66746e; --line:#d8e0db; --teal:#0c5f55; --green:#0a8150; --amber:#936007; --amber-soft:#fff3dc; --red:#a23b30; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; } main { width:min(1080px,100%); margin:0 auto; padding:26px 16px 48px; display:grid; gap:16px; } header,.section-head { display:flex; justify-content:space-between; gap:14px; align-items:start; } h1,h2,p { margin:0; } h1 { font-size:25px; } h2 { font-size:19px; } .eyebrow,.muted { color:var(--muted); font-size:13px; font-weight:750; } a { color:var(--teal); font-weight:850; } button { min-height:40px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); padding:8px 12px; font:inherit; font-weight:850; cursor:pointer; } button.primary { background:var(--teal); border-color:var(--teal); color:#fff; } button:disabled { opacity:.5; cursor:default; }
    section { border:1px solid var(--line); border-radius:7px; background:var(--surface); padding:16px; } .notice { border-left:4px solid var(--amber); background:var(--amber-soft); padding:12px; font-weight:750; line-height:1.45; } .metrics { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; } .metric { padding:12px; border:1px solid var(--line); border-radius:6px; display:grid; gap:4px; } .metric span { color:var(--muted); font-size:12px; font-weight:750; } .metric strong { font-size:22px; }.progress { height:10px; background:#e8eeea; border-radius:99px; overflow:hidden; margin-top:12px; } .progress i { display:block; height:100%; background:var(--teal); transition:width .25s; }
    .timeline { display:grid; gap:8px; } .event { display:grid; grid-template-columns:76px minmax(150px,1fr) minmax(130px,1fr) minmax(120px,1.4fr); gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-size:13px; } .event:last-child { border-bottom:0; } .state { font-weight:850; } .state.ready { color:var(--green); } .state.stale,.state.waiting { color:var(--amber); } .lane { display:inline-block; min-width:46px; margin:2px 4px 2px 0; padding:5px; border:1px solid var(--line); border-radius:5px; text-align:center; } .lane.recommended { border:2px solid var(--green); background:#eef9f2; } .lane small { display:block; color:var(--muted); font-size:10px; font-weight:750; } .empty { color:var(--muted); font-weight:750; } @media (max-width:760px) { main { padding:18px 12px 36px; } header,.section-head { display:grid; } .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); } .event { grid-template-columns:1fr; gap:5px; } }
  </style>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">Corridor Observer／通勤行程報表 v1</p><h1>新店至楊梅｜時間模擬驗測</h1></div><a href="/report">回營運報表</a></header>
    <section><div class="section-head"><div><p class="eyebrow">測試控制</p><h2 id="sessionTitle">尚未開始測試行程</h2></div><div><button id="start" class="primary" type="button">開始時間模擬</button><button id="stop" type="button" disabled>結束並保留紀錄</button></div></div><p class="notice" id="notice">此頁是流程驗測，不使用實車 GPS，也不宣稱真實行程時間。每 4 秒依序記錄一支鏡頭的當下後端資料，完整走完十支鏡頭約 40 秒。</p><div class="progress" aria-label="模擬進度"><i id="progress"></i></div></section>
    <section class="metrics" aria-label="行程摘要"><div class="metric"><span>已記錄路段</span><strong id="segments">0 / 10</strong></div><div class="metric"><span>串流正常</span><strong id="stream">--</strong></div><div class="metric"><span>官方資料延遲</span><strong id="delayed">--</strong></div><div class="metric"><span>可提出建議</span><strong id="recommendations">--</strong></div><div class="metric"><span>官方資料不可用</span><strong id="unavailable">--</strong></div></section>
    <section><div class="section-head"><div><p class="eyebrow">事件時間軸</p><h2>鏡頭切換與資料判讀</h2></div><span class="muted" id="updated">等待行程開始</span></div><div class="timeline" id="timeline"><p class="empty">尚無紀錄。</p></div></section>
  </main>
  <script>
    const base='/v1/corridors/n3-south-xindian-yangmei/trip-sessions'; let session=null; let timer=0; let nextIndex=0; let cameras=[];
    const $=id=>document.getElementById(id); const fmtTime=value=>new Date(value).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    const stateText=state=>({ready:'資料可用',stale:'官方資料延遲',unavailable:'官方資料不可用'}[state]||'資料等待中');
    function render(){const summary=session?.summary||{};$('segments').textContent=`${summary.capturedSegments||0} / ${cameras.length||10}`;$('stream').textContent=session?`${summary.readyCctvSegments||0} / ${summary.capturedSegments||0}`:'--';$('delayed').textContent=session?summary.delayedOfficialDataSegments||0:'--';$('recommendations').textContent=session?summary.recommendationSegments||0:'--';$('unavailable').textContent=session?summary.unavailableOfficialDataSegments||0:'--';const progress=cameras.length?Math.min(100,((summary.capturedSegments||0)/cameras.length)*100):0;$('progress').style.width=`${progress}%`;$('sessionTitle').textContent=session?`${session.id}｜${session.state==='active'?'模擬進行中':'測試完成'}`:'尚未開始測試行程';$('stop').disabled=!session||session.state!=='active';$('start').disabled=Boolean(session&&session.state==='active');$('timeline').replaceChildren(...(session?.events?.length?session.events.map(event=>{const row=document.createElement('article');row.className='event';const lanes=event.road.lanes.map(lane=>`<span class="lane${event.road.recommendation?.laneIndex===lane.laneIndex?' recommended':''}"><small>第 ${lane.laneIndex}</small>${lane.speedKph}<small>km/h</small></span>`).join('')||'<span class="empty">無可用速度</span>';row.innerHTML=`<div><strong>+${event.simulatedElapsedSeconds||0}s</strong><br><span class="muted">${fmtTime(event.capturedAt)}</span></div><div><strong>${event.sequence}. ${event.mile}</strong><br>${event.label}</div><div><span class="state ${event.cctv.state}">串流 ${event.cctv.state==='ready'?'正常':'等待'}</span><br>${event.cctv.sourceFps||'--'} FPS</div><div><span class="state ${event.road.state}">${stateText(event.road.state)}</span><br>${lanes}<br><span class="muted">${event.road.recommendation?.detail||event.road.detail||'暫不推薦車道。'}</span></div>`;return row;}):[Object.assign(document.createElement('p'),{className:'empty',textContent:'尚無紀錄。'})]));$('updated').textContent=session?.events?.length?`最後記錄：${fmtTime(session.events.at(-1).capturedAt)}`:'等待行程開始';}
    async function request(path,body){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const data=await response.json();if(!response.ok)throw new Error(data.error||'request_failed');return data;}
    async function step(){if(!session||session.state!=='active')return;if(nextIndex>=cameras.length){const data=await request(`${base}/${session.id}/finish`);session=data.session;window.clearInterval(timer);timer=0;$('notice').textContent='十支鏡頭已完成時間模擬。此紀錄可用於檢查切換流程、串流健康與官方資料可用性，不代表實車導航結果。';render();return;}const camera=cameras[nextIndex];const data=await request(`${base}/${session.id}/capture`,{cameraId:camera.id,simulatedElapsedSeconds:nextIndex*90});session=data.session;nextIndex+=1;render();}
    $('start').addEventListener('click',async()=>{try{const output=await fetch('/v1/corridors/n3-south-xindian-yangmei/output',{cache:'no-store'}).then(response=>response.json());cameras=output.cameras||[];const data=await request(base,{mode:'time_simulation'});session=data.session;nextIndex=0;$('notice').textContent='時間模擬已開始：每段會向後端擷取一次當下 CCTV／官方 VD 狀態。';render();await step();timer=window.setInterval(()=>void step(),4000);}catch(error){$('notice').textContent=`無法開始測試：${error.message}`;}});
    $('stop').addEventListener('click',async()=>{if(!session)return;const data=await request(`${base}/${session.id}/finish`);session=data.session;window.clearInterval(timer);timer=0;$('notice').textContent='測試已手動結束，已保留目前事件紀錄。';render();});
    async function loadLatest(){try{const [output, history]=await Promise.all([fetch('/v1/corridors/n3-south-xindian-yangmei/output',{cache:'no-store'}).then(response=>response.json()),fetch(base,{cache:'no-store'}).then(response=>response.json())]);cameras=output.cameras||[];session=history.sessions?.[0]||null;if(session)$('notice').textContent=`已載入最近一次 ${session.mode==='time_simulation'?'時間模擬':'行車'}紀錄；可開始新的測試行程。`;render();}catch(error){$('notice').textContent=`無法讀取行程紀錄：${error.message}`;render();}}
    loadLatest();
  </script>
</body>
</html>
